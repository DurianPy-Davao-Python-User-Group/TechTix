service: durianpy-events-api
frameworkVersion: "^3.40.0"

custom:
  organization: ${param:organization, env:ORGANIZATION, 'durianpy'}
  projectName: ${self:custom.organization}-events
  serviceName: events
  stage: ${opt:stage, self:provider.stage}
  corsOrigin:
    prod: '*.durianpy.org'
    default: '*'
  corsOriginValue: ${self:custom.corsOrigin.${self:custom.stage}, self:custom.corsOrigin.default}
  s3CorsAllowedOrigins:
    prod:
      - '*.durianpy.org'
      - 'https://*.durianpy.org'
      - 'https://durianpy.org'
    default:
      - '*'
  apiGatewayRateLimit: 30
  apiGatewayBurstLimit: 30
  pitr:
    prod: true
  pitrEnabled: ${self:custom.pitr.${self:custom.stage}, false}
  paymentQueue: ${self:custom.stage}-${self:custom.projectName}-payment-queue.fifo
  entities: ${self:custom.stage}-${self:custom.projectName}-entities
  events: ${self:custom.stage}-${self:custom.projectName}
  bucket: ${self:custom.stage}-${self:custom.projectName}-file-bucket
  registrations: ${self:custom.stage}-${self:custom.projectName}-registrations
  preregistrations: ${self:custom.stage}-${self:custom.projectName}-preregistrations
  evaluations: ${self:custom.stage}-${self:custom.projectName}-evaluations
  frontendUrl: ${ssm:/techtix/frontend-url-${self:custom.stage}}
  # konfHubApiKey: ${ssm:/konfhub/api-key-${self:custom.stage}}
  betterCredentials:
    enabled: true

  # Alarm destination is owned by durianpy-root-infra and published to SSM, so
  # the same value resolves in both the nonprod and prod accounts. The default
  # keeps `sls print`/`package` working before that stack has been applied.
  alarmTopicArn: ${ssm:/durianpy/observability/alarm-topic-arn, ''}
  # dev is a scratch stage with no traffic worth paging on; alarms there would
  # be pure cost. staging and prod are the environments that page.
  alarmsEnabledByStage:
    dev: "false"
    staging: "true"
    prod: "true"
  alarmsEnabled: ${self:custom.alarmsEnabledByStage.${self:custom.stage}, "true"}
  alarmThresholds:
    serverErrorCount: 1
    clientErrorRatePercent: 25
    minimumRequests: 20
    functionErrorCount: 1

  serverlessIamRolesPerFunction:
    # serverless-iam-roles-per-function builds each function role from scratch
    # and drops the X-Ray grants Serverless adds to the shared role, so tracing
    # would silently fail. Inheriting provider.iamRoleStatements puts them back.
    defaultInherit: true
  emailQueue: !ImportValue EmailQueue-${self:custom.stage}
  certificateQueue: !ImportValue CertificateQueue-${self:custom.stage}
  basicAuthorizerARN: !ImportValue BasicAuthAuthorizerARN-${self:custom.stage}
  pythonRequirements:
    dockerizePip: true
    usePoetry: false
    noDeploy:
      - requests
      - boto3
      - botocore
    layer:
      name: ${self:custom.organization}-events-${self:custom.stage}-python-requirements
      compatibleRuntimes:
        - python3.11
    slim: true

package: ${file(resources/package.yml)}

provider:
  name: aws
  runtime: python3.11
  stage: dev
  region: ap-southeast-1
  memorySize: 3008
  versionFunctions: false
  timeout: 30
  apiGateway:
    resourcePolicy:
      - Effect: Allow
        Action: execute-api:Invoke
        Principal: "*"
        Resource: execute-api:/*/*/*
    usagePlan:
      throttle:
        rateLimit: ${self:custom.apiGatewayRateLimit}
        burstLimit: ${self:custom.apiGatewayBurstLimit}
  # Sampling rate is controlled centrally by the X-Ray sampling rules in
  # durianpy-root-infra: 100% on the dev stage, 5% elsewhere with an adaptive
  # boost during anomalies. API Gateway makes the decision and Lambda honours it.
  tracing:
    apiGateway: true
    lambda: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      # The X-Ray write APIs have no resource-level permissions; "*" is the
      # only resource these actions accept.
      Resource: "*"
  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:custom.stage}
    FRONTEND_URL: ${self:custom.frontendUrl}
    ENTITIES_TABLE: ${self:custom.entities}
    REGISTRATIONS_TABLE: ${self:custom.registrations}
    PREREGISTRATIONS_TABLE: ${self:custom.preregistrations}
    EVALUATIONS_TABLE: ${self:custom.evaluations}
    EVENTS_TABLE: ${self:custom.events}
    EMAIL_QUEUE: ${self:custom.emailQueue}
    PAYMENT_QUEUE: ${self:custom.paymentQueue}
    CERTIFICATE_QUEUE: ${self:custom.certificateQueue}
    S3_BUCKET: ${self:custom.bucket}
    SECRET_TOKEN: ${ssm:/techtix/events-api-secret-token-${self:custom.stage}}
    # KONFHUB_API_KEY: ${self:custom.konfHubApiKey}
    USER_POOL_ID: !ImportValue UserPoolId-${self:custom.stage}
    USER_POOL_CLIENT_ID: !ImportValue AppClientId-${self:custom.stage}
    SPARCS_GMAIL: sparcsup@gmail.com
  logs:
    restApi:
      role: !GetAtt ApiGatewayCloudWatchRole.Arn

resources:
  - ${file(resources/dynamodb.yml)}
  - ${file(resources/api_gateway.yml)}
  - ${file(resources/s3.yml)}
  - ${file(resources/sqs.yml)}
  - ${file(resources/frontend_role.yml)}
  - ${file(resources/alarms.yml)}
  - Resources:
      ApiGatewayCloudWatchRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: serverlessApiGatewayCloudWatchRole-${self:custom.serviceName}-${self:custom.stage}
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Principal:
                  Service: apigateway.amazonaws.com
                Action: sts:AssumeRole
          Policies:
            - PolicyName: AllowCloudWatchLogs
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action:
                      - logs:CreateLogGroup
                      - logs:CreateLogStream
                      - logs:DescribeLogGroups
                      - logs:DescribeLogStreams
                      - logs:PutLogEvents
                    Resource: "*"

    Outputs:
      ApiGatewayCloudWatchRoleArn:
        Value: !GetAtt ApiGatewayCloudWatchRole.Arn
        Export:
          Name: ApiGatewayCloudWatchRole-${self:custom.serviceName}-${self:custom.stage}

functions:
  - ${file(resources/api.yml)}
  - ${file(resources/functions.yml)}

plugins:
  - serverless-better-credentials
  - serverless-python-requirements
  - serverless-iam-roles-per-function
