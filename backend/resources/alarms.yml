# Alarms notify the account-wide SNS topic from durianpy-root-infra, resolved
# from SSM so this file works unchanged in nonprod and prod.
Conditions:
  ShouldCreateAlarms:
    Fn::Equals:
      - ${self:custom.alarmsEnabled}
      - "true"

Resources:
  # A 5xx is the API's fault, not the caller's, so alarm on the first one.
  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldCreateAlarms
    Properties:
      AlarmName: ${self:custom.stage}-${self:service}-5xx
      AlarmDescription: >-
        API Gateway returned at least ${self:custom.alarmThresholds.serverErrorCount}
        5xx response in 5 minutes for ${self:custom.stage}-${self:service}.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: ${self:custom.stage}-${self:service}
        - Name: Stage
          Value: ${self:custom.stage}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: ${self:custom.alarmThresholds.serverErrorCount}
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - ${self:custom.alarmTopicArn}
      OKActions:
        - ${self:custom.alarmTopicArn}

  # Rate-based: a Cognito authorizer and a 30 req/s usage plan make 401s and
  # 429s routine, so a raw count is either noisy or too high to catch a spike.
  # The IF() guard stops one 404 on an idle stage reading as 100%.
  ApiClientErrorSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldCreateAlarms
    Properties:
      AlarmName: ${self:custom.stage}-${self:service}-4xx-spike
      AlarmDescription: >-
        More than ${self:custom.alarmThresholds.clientErrorRatePercent}% of requests to
        ${self:custom.stage}-${self:service} returned 4xx across two consecutive
        5-minute windows.
      Metrics:
        - Id: clientErrors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 4XXError
              Dimensions:
                - Name: ApiName
                  Value: ${self:custom.stage}-${self:service}
                - Name: Stage
                  Value: ${self:custom.stage}
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions:
                - Name: ApiName
                  Value: ${self:custom.stage}-${self:service}
                - Name: Stage
                  Value: ${self:custom.stage}
            Period: 300
            Stat: Sum
        - Id: clientErrorRate
          ReturnData: true
          Label: 4xx share of requests (%)
          Expression: >-
            IF(requests >= ${self:custom.alarmThresholds.minimumRequests},
            100 * clientErrors / requests, 0)
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: ${self:custom.alarmThresholds.clientErrorRatePercent}
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - ${self:custom.alarmTopicArn}
      OKActions:
        - ${self:custom.alarmTopicArn}

  # SQS-driven, so its failures never surface in the 5xx metric. It turns a
  # completed payment into a confirmed registration; a silent failure here is
  # invisible until the attendee notices they were charged and have no ticket.
  PaymentHandlerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldCreateAlarms
    Properties:
      AlarmName: ${self:custom.stage}-${self:service}-payment-handler-errors
      AlarmDescription: >-
        The paymentHandler consumer failed at least
        ${self:custom.alarmThresholds.functionErrorCount} time(s) in 5 minutes on
        ${self:custom.stage}.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: ${self:service}-${self:custom.stage}-paymentHandler
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: ${self:custom.alarmThresholds.functionErrorCount}
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - ${self:custom.alarmTopicArn}
      OKActions:
        - ${self:custom.alarmTopicArn}
