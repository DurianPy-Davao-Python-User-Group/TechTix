app:
  handler: main.handler
  environment:
    STAGE: ${self:custom.stage}
  layers:
    - { Ref: PythonRequirementsLambdaLayer }
  events:
    - http:
        path: /
        method: get
        cors:
          origin: ${self:custom.corsOriginValue}
          headers:
            - Content-Type
            - X-Amz-Date
            - Authorization
            - X-Api-Key
            - X-Amz-Security-Token
            - X-Amz-User-Agent
            - X-Amzn-Trace-Id
          allowCredentials: true
    - http:
        path: /{proxy+}
        method: any
        cors:
          origin: ${self:custom.corsOriginValue}
          headers:
            - Content-Type
            - X-Amz-Date
            - Authorization
            - X-Api-Key
            - X-Amz-Security-Token
            - X-Amz-User-Agent
            - X-Amzn-Trace-Id
          allowCredentials: true
    - http:
        path: /docs
        method: get
        authorizer:
          arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:custom.organization}-auth-service-${self:custom.stage}-basicAuthAuthorizer
          resultTtlInSeconds: 0
  iamRoleStatements:
    - Effect: Allow
      Action:
        - "dynamodb:*"
      Resource:
        - { "Fn::GetAtt": [Entities, Arn] }
    - Effect: Allow
      Action:
        - "dynamodb:*"
      Resource:
        - { "Fn::GetAtt": [Evaluations, Arn] }
        - "Fn::Join":
            - "/"
            - - "Fn::GetAtt": [Evaluations, Arn]
              - "index"
              - "*"
    - Effect: Allow
      Action:
        - "dynamodb:*"
      Resource:
        - { "Fn::GetAtt": [Events, Arn] }
        - "Fn::Join":
            - "/"
            - - "Fn::GetAtt": [Events, Arn]
              - "index"
              - "*"
    - Effect: Allow
      Action:
        - "dynamodb:*"
      Resource:
        - { "Fn::GetAtt": [Registrations, Arn] }
        - "Fn::Join":
            - "/"
            - - "Fn::GetAtt": [Registrations, Arn]
              - "index"
              - "*"
    - Effect: Allow
      Action:
        - "dynamodb:*"
      Resource:
        - { "Fn::GetAtt": [PreRegistrations, Arn] }
        - "Fn::Join":
            - "/"
            - - "Fn::GetAtt": [PreRegistrations, Arn]
              - "index"
              - "*"
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - arn:aws:ssm:*:*:parameter/${self:custom.organization}-auth-secret-key-${self:custom.stage}
    - Effect: Allow
      Action:
        - "sqs:*"
      Resource:
        - !Sub arn:aws:sqs:ap-southeast-1:${AWS::AccountId}:${self:custom.stage}-${self:custom.organization}-events-email-queue.fifo
        - !Sub arn:aws:sqs:ap-southeast-1:${AWS::AccountId}:${self:custom.stage}-${self:custom.organization}-events-certificate-queue.fifo
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
      Resource:
        - arn:aws:s3:::${self:custom.bucket}
        - arn:aws:s3:::${self:custom.bucket}/*
